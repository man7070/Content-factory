<title>Контент-завод</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: левая колонка-конвейер из 6 станций; справа вкладки с данными */
:root{--bg:#f3f2ee;--surface:#fbfaf7;--fg:#1d1f1c;--mut:#6b6f66;--line:#d9d7cf;--accent:#e4572e;--accent-fg:#fff;--ok:#2f7d4f;--warn:#b7791f;--bad:#b83232;
--f:'Onest',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c0f;--surface:#12151a;--fg:#e9edf2;--mut:#8791a0;--line:#262c35;--accent:#ff6b3d;--accent-fg:#160a05;--ok:#4cc38a;--warn:#e5ae4a;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c0f;--surface:#12151a;--fg:#e9edf2;--mut:#8791a0;--line:#262c35;--accent:#ff6b3d;--accent-fg:#160a05;--ok:#4cc38a;--warn:#e5ae4a;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:28px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--mut);margin:2px 0 0}
.flow{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.flow div{flex:1 1 150px;padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.flow div:last-child{border-right:0}
.flow b{display:block;font-size:13px}.flow span{font:12px var(--m);color:var(--mut)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{font:500 14px var(--f);padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
nav button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col h3{margin:0;font:500 12px var(--m);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:6px}
.card b{font-size:14px}.meta{font:12px var(--m);color:var(--mut);overflow-wrap:anywhere}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.card button{font:12px var(--f);padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);cursor:pointer}
.pill{font:11px var(--m);padding:2px 7px;border-radius:99px;border:1px solid var(--line);width:fit-content}
.pill.motion{color:var(--accent);border-color:var(--accent)}.pill.library{color:var(--ok);border-color:var(--ok)}.pill.hybrid{color:var(--warn);border-color:var(--warn)}
form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
input,select,textarea{font:15px var(--f);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
form .wide{grid-column:1/-1}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font:500 12px var(--m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
tr:last-child td{border-bottom:0}
.empty{padding:18px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:0}
.rule{font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background .15s}}

.board{grid-template-columns:repeat(8,minmax(190px,1fr))!important}
.col.dim{opacity:.45}.col.mine{border-color:var(--accent)}
.role{font:11px var(--m);color:var(--accent)}
.card{cursor:pointer}.card:hover{border-color:var(--accent)}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{font:12px var(--m);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.stepper span.done{color:var(--ok);border-color:var(--ok)}.stepper span.now{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.sec>summary .role{font-weight:400}
details.sec.active{border-color:var(--accent)}
.sec .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.scene{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.scene h4{margin:0;font:500 13px var(--m);display:flex;justify-content:space-between;gap:8px}
.ro{background:var(--surface);padding:8px;border-radius:6px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.ro small{display:block;font:11px var(--m);color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.err{color:var(--bad);font-size:14px}
input:disabled,select:disabled,textarea:disabled{opacity:.7}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}.chk input{width:auto}
.board{grid-template-columns:repeat(7,minmax(165px,1fr))!important}
.board.few{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important}
.prog{font:12px var(--m);color:var(--fg)}
label.hd,header label{white-space:nowrap}
.bar{border-top:1px solid var(--line)}
.bar .btn.primary{flex:1 1 260px;text-align:center}
.ready{font-size:13px;color:var(--mut);flex:1 1 100%}.ready.ok{color:var(--ok)}
.hist{font:500 12px var(--m);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:6px}
.linkbtn{background:none;border:0;color:var(--mut);font:13px var(--f);text-decoration:underline;cursor:pointer;padding:6px 0;width:fit-content}
@media (max-width:720px){.board{display:flex!important;flex-direction:column;overflow:visible}.col{min-height:0}.col.emp{display:none}.flowhide{display:none}}
.aprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.apbox{display:flex;flex-direction:column;gap:8px}button:disabled{opacity:.45;cursor:not-allowed}.tag{font:11px var(--m);color:var(--accent)}.chips{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}.crow{display:flex;gap:6px;flex-wrap:wrap}.chip{font:500 14px var(--m);padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--fg);cursor:pointer}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.errbox{border:1px solid var(--bad);border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--fg);border-radius:8px;padding:10px 14px}.errbox ul{margin:6px 0 0;padding-left:18px;font-size:14px}.errbox[hidden]{display:none}
input.bad,select.bad,textarea.bad,.crow.bad{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}.crow.bad{padding:4px;border:1px solid;border-radius:99px}
input.good,select.good,textarea.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.crow.good .chip[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--bg)}label.chk.bad{color:var(--bad)}label.chk.good{color:var(--ok)}.takes{display:flex;flex-direction:column;gap:8px}.take{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}.take .row{display:flex;gap:6px;flex-wrap:wrap}.ok{color:var(--ok)}.review{display:grid;grid-template-columns:minmax(260px,5fr) minmax(0,7fr);gap:16px;align-items:start}.rv-left{position:sticky;top:12px}.rv-right{display:flex;flex-direction:column;gap:12px;min-width:0}.rv-sticky{display:flex;flex-direction:column;gap:8px}.vid{width:100%;max-height:78vh;background:#000;border-radius:8px}.vidbox{border:1px dashed var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface);overflow-wrap:anywhere}@media (max-width:820px){.review{grid-template-columns:1fr}.rv-left{position:static}}.rvgroup{display:flex;flex-direction:column;gap:6px}.rvrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}.rvrow.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}.rvrow.miss,.rvrow.extra{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--bg))}.rvtxt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}.rvtxt small{display:block;font:11px var(--m);color:var(--mut)}.rvbtns{display:flex;gap:4px;flex-wrap:wrap}.rvb{font:500 13px var(--f);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer}.rvb[aria-pressed=true].ok{background:var(--ok);color:var(--bg);border-color:var(--ok)}.rvb[aria-pressed=true].miss,.rvb[aria-pressed=true].extra{background:var(--bad);color:var(--bg);border-color:var(--bad)}.rvnote{grid-column:1/-1}@media (max-width:560px){.rvrow{grid-template-columns:1fr}}.rows{display:flex;flex-direction:column;gap:12px}.rows .board{grid-template-columns:repeat(6,minmax(150px,1fr))!important}.rows .board:not(:nth-child(2)){grid-template-columns:repeat(6,minmax(150px,1fr))!important}@media (max-width:720px){.rows .board{display:flex!important}}.sw{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f);color:var(--mut);cursor:pointer;background:none;border:0;padding:4px}.sw .trk{width:44px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--surface);position:relative;transition:background .2s}.sw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s}:root[data-theme=dark] .sw .knob{transform:translateX(20px);background:var(--accent)}:root[data-theme=dark] .sw .trk{border-color:var(--accent)}@media (prefers-reduced-motion:reduce){.sw .knob,.sw .trk{transition:none}}</style>
<div class="wrap">
<header><div><h1>Контент-завод</h1><p class="sub">У каждого этапа своя роль и своя форма. Передать дальше можно, когда этап заполнен.</p></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label style="flex-direction:row;align-items:center;gap:6px">Моя роль<select id="role"></select></label><button class="sw" id="themebtn" type="button" aria-label="Тёмная тема"><span>Тёмная</span><span class="trk"><span class="knob"></span></span></button><button class="btn primary" id="newbtn">+ Новый ролик</button></div></header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<p class="note" id="status" role="status"></p>
</div>
<script>
const ST=[
 {k:'бриф',role:'Автор брифа',hint:'Заполняет бриф: что за ролик, для кого, зачем.'},
 {k:'сценарий',role:'Сценарист',hint:'Пишет сценарий по сценам: голос, текст на экране, визуал.'},
 {k:'съёмка',role:'Видеомейкер',hint:'Читает сценарий и распределяет кадры: как и где снимать, что снято.'},
 {k:'сборка материала',role:'Проект-менеджер',hint:'Смотрит отснятое и привязывает файлы к сценам.'},
 {k:'AI B-roll',role:'AI контент-мейкер',hint:'Генерирует кадры, которые нельзя снять: AI B-roll или анимацию. Только для сцен, где съёмка невозможна.'},
 {k:'упаковка',role:'Проект-менеджер → Монтажёр',hint:'ПМ пишет инструкцию по каждой сцене, монтажёр склеивает и даёт ссылку на рендер.'},
 {k:'готов',role:'ОТК',hint:'Проверка готового ролика по чек-листу.'},
 {k:'публикация',role:'SMM',hint:'Площадка, дата и ссылка на публикацию.'}];
const ROLES=['Все','Главный','Автор брифа','Сценарист','Видеомейкер','Проект-менеджер','AI контент-мейкер','Монтажёр','ОТК','SMM'];
const ROLEMAP={'Главный':[0,1,2,3,4,5,6,7],'Автор брифа':[0],'Сценарист':[1],'Видеомейкер':[2],'Проект-менеджер':[3,5],'AI контент-мейкер':[4],'Монтажёр':[5],'ОТК':[6],'SMM':[7]};
const QC=[['hook','Хук в первые 3 секунды'],['text','Текст читается, без опечаток'],['brand','Цвета, шрифты, лого и CTA по бренду'],['audio','Громкость −14 LUFS, голос не тонет'],['fmt','Формат, fps и длительность по брифу']];
const FMT=['9:16 Reels 1080×1920','1:1','16:9'],APPROACH=['','motion','library','hybrid','voice-motion'];
let db=null,U=null,AS=null,me=null,tab='queue',role=(()=>{try{return localStorage.getItem('role')||'Все'}catch(e){return 'Все'}})(),openId=null,data={jobs:[],clips:[],brands:[],styles:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setStatus=t=>{$('#status').textContent=t||''};
const days=t=>{if(!t||t<1e12)return '';const m=(Date.now()-t)/6e4;return m<60?'только что':m<1440?Math.floor(m/60)+' ч в этапе':Math.floor(m/1440)+' дн в этапе'};
function prog(j){const sc=j.scenes||[],n=idx(j),c=f=>sc.filter(f).length;
 return [j.cta?'CTA указан':'CTA не указан',`сцен: ${sc.length}`,`снято ${c(s=>s.take==='снято')}/${sc.length}`,`файлов ${c(s=>s.file)}/${sc.length}`,`AI-кадров ${c(s=>isGap(s)&&s.aiStatus==='сгенерировано')}/${c(isGap)}`,`в монтаже ${c(s=>s.edited)}/${sc.length} · инструкций ${c(s=>s.editInstr||j.editInstr)}/${sc.length}${j.renderUrl?' · рендер есть':''}`,`ОТК ${Object.values(j.qc||{}).filter(Boolean).length}/5`,j.published?'опубликовано':(j.platform||'площадка не выбрана')][n]}
const idx=j=>Math.max(0,ST.findIndex(s=>s.k===j.status));
function tabs(){const T=[['queue','Очередь'],['clips','База клипов'],['brands','Бренды'],['styles','Стили']];
 $('#tabs').innerHTML=T.map(([k,n])=>`<button role="tab" aria-selected="${k===tab&&!openId}" data-t="${k}">${n}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;openId=null;render()})}
function render(){tabs();$('#role').innerHTML=ROLES.map(r=>`<option${r===role?' selected':''}>${r}</option>`).join('');
 if(openId&&data.jobs.find(j=>j.id===openId))return detail();openId=null;({queue,new:newJob,clips,brands,styles})[tab]()}
const needDb=()=>db?'':'<div class="rule">Сохранение недоступно в этом просмотре: войдите в аккаунт, чтобы данные записывались.</div>';
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
function queue(){
 const mine=role==='Все'?[]:ROLEMAP[role];const show=ST.map((_,i)=>i).filter(i=>!mine.length||mine.includes(i));
 $('#view').innerHTML=needDb()+`${mine.length?`<p class="note">Показаны этапы роли «${role}». Чтобы увидеть весь завод, выберите «Все» в поле «Моя роль».</p>`:''}${(()=>{const col=i=>{const s=ST[i];const js=data.jobs.filter(j=>idx(j)===i);
 return `<section class="col ${js.length?'':'emp'}"><h3><span>${s.k}</span><span>${js.length}</span></h3><span class="role">${s.role}</span>${js.map(j=>`<div class="card" tabindex="0" data-open="${j.id}"><b>${esc(j.topic)}</b><span class="meta">${esc(j.brand)}${j.format?' · '+esc(j.format):''}</span>${j.approach?`<span class="pill ${esc(j.approach)}">${esc(j.approach)}</span>`:''}<span class="prog">${esc(prog(j))}</span><span class="meta">${esc(days(j.since||j.created))}</span></div>`).join('')||'<span class="meta">пусто</span>'}</section>`};const row=ix=>`<div class="board ${mine.length?'few':''}">${ix.map(col).join('')}</div>`;return mine.length?row(show):`<div class="rows">${row([0])}${row([1,2,3,4,5,6])}${row([7])}</div>`})()}`+(data.jobs.length?'':'<div class="empty">Очередь пуста. Нажмите «+ Новый ролик».</div>')+'<p class="note">Откройте карточку: сверху форма текущего этапа, ниже справка по прошлым.</p>';
 $('#view').querySelectorAll('[data-open]').forEach(c=>{c.onclick=()=>{openId=c.dataset.open;render()};c.onkeydown=e=>{if(e.key==='Enter'){openId=c.dataset.open;render()}}})}
function newJob(){
 $('#view').innerHTML=needDb()+`<form id="f"><label>Бренд<input id="brand" list="bl" required><datalist id="bl">${data.brands.map(b=>`<option>${esc(b.name)}</option>`).join('')}</datalist></label>
 <label class="wide">Тема / оффер<input id="topic" required placeholder="О чём ролик"></label>
 <label class="wide">Партия: ещё темы, по одной в строке (необязательно)<textarea id="more" rows="3"></textarea></label>
 <div class="wide"><button class="btn primary" type="submit">Создать и открыть бриф</button></div></form>`;
 $('#f').onsubmit=async e=>{e.preventDefault();if(!db){setStatus('Нужен вход в аккаунт.');return}
  const ts=[$('#topic').value.trim(),...$('#more').value.split('\n').map(s=>s.trim()).filter(Boolean)];let last;
  try{for(const t of ts)last=await db.collection('jobs').add({brand:$('#brand').value.trim(),topic:t,status:'бриф',chief:me||'',appr:{},format:FMT[0],lang:'русский',duration:30,scenes:[],qc:{},created:Date.now()});
   openId=last.id;tab='queue';render()}catch(err){setStatus('Не удалось сохранить: '+err.message)}}}
/* ---------- карточка ролика ---------- */
function fld(label,key,val,o={}){const dis=o.dis?'disabled':'';const at=`data-k="${key}"${o.i!=null?` data-i="${o.i}"`:''}`;
 if(o.dis&&o.ro)return `<div><div class="ro"><small>${label}</small>${esc(val)||'—'}</div></div>`;
 let c;if(o.opts)c=`<select ${at} ${dis}>${opts(o.opts,val)}</select>`;
 else if(o.rows)c=`<textarea ${at} rows="${o.rows}" ${dis} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(val)}</textarea>`;
 else c=`<input ${at} type="${o.type||'text'}" value="${esc(val)}" ${dis} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`;
 return `<label>${label}${c}${o.tag?`<span class="tag">${o.tag}</span>`:''}</label>`}
function sec(title,roleName,open,active,inner){return `<details class="sec ${active?'active':''}" ${open?'open':''}><summary>${title}<span class="role">${roleName}</span></summary><div class="body">${inner}</div></details>`}
const BYSTAGE=['автор брифа','сценарист','видеомейкер','проект-менеджер','AI контент-мейкер','монтажёр'];
const OUTF=['9:16','1:1','16:9','4:5'];

const FB=['how','who','place','editInstr','broll'];

function miss(j,n){const sc=j.scenes||[],m=[],sn=i=>'Сцена '+(i+1)+': ';
 if(n===0){if(!j.brand)m.push('бренд');if(!j.topic)m.push('тема');if(!j.cta)m.push('CTA')}
 if(n===1){if(!sc.length)m.push('добавьте хотя бы одну сцену');sc.forEach((s,i)=>{if(!s.voice&&!s.screen)m.push(sn(i)+'голос или текст на экране')})}
 if(n===2)sc.forEach((s,i)=>{if(isGap(s))return;
  [['how','как снимать'],['who','с кем снимать'],['place','где снимать']].forEach(([k,l])=>{if(!(s[k]||j[k]))m.push(sn(i)+l)});
  if(s.take!=='снято')m.push(sn(i)+'статус «снято»');
  if(s.broll&&!DONE.brollStatus.includes(s.brollStatus))m.push(sn(i)+'живой B-roll: статус «снято» или «не нужен»')});
 if(n===3)sc.forEach((s,i)=>{if(!s.verdict)m.push(sn(i)+'вердикт');if(!s.file&&!isGap(s))m.push(sn(i)+'файл')});
 if(n===4)sc.forEach((s,i)=>{if(!isGap(s))return;if(!s.aiFile)m.push(sn(i)+'результат (файл или ссылка)');if(s.aiStatus!=='сгенерировано')m.push(sn(i)+'статус «сгенерировано»')});
 if(n===5){if(!j.outFmt)m.push('выходные форматы');sc.forEach((s,i)=>{if(!(s.editInstr||j.editInstr))m.push(sn(i)+'инструкция монтажёру');if(!s.edited)m.push(sn(i)+'отметьте «готово в монтаже»')});if(!j.renderUrl)m.push('ссылка на рендер')}
 if(n===6){const c=rvStats(j);if(c.none)m.push('чек-лист по ролику: не проверено пунктов — '+c.none);const r=j.review||{};reviewItems(j).forEach(x=>{const e=r[x.key];if(e&&e.st&&e.st!=='ok'&&!(e.note||'').trim())m.push('комментарий к пункту «'+x.l+'»')})}
 if(n===6)QC.forEach(([k,l])=>{if(!(j.qc||{})[k])m.push('ОТК: '+l.toLowerCase())});
 if(n===7){if(!j.platform)m.push('площадка');if(!j.pubDate)m.push('дата публикации')}
 return m}
function check(j,n){const m=miss(j,n);return m.length?'не заполнено: '+m[0]+(m.length>1?' и ещё '+(m.length-1):''):''}
/* подсветка: красное = обязательное пусто, зелёное = заполнено */

 const eb=$('#errbox');if(eb){eb.hidden=!m.length;eb.innerHTML=m.length?`<b>Не заполнено на этапе «${ST[n].k}»</b><ul>${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 const req={0:['brand','topic','cta'],1:['voice','screen'],2:['how','who','place','take','brollStatus'],3:['verdict','file'],4:['aiFile','aiStatus'],5:['editInstr','renderUrl'],7:['platform','pubDate']}[n]||[];
 d.querySelectorAll('details.active [data-k]').forEach(el=>{if(el.disabled)return;const k=el.dataset.k,i=el.dataset.i;let v,filled;
  const s=i!=null?sc[+i]:null;if(s&&isGap(s)&&n===2){el.classList.remove('good','bad');return}
  v=s?(s[k]||(FB.includes(k)?j[k]:'')):j[k];

  if(k==='voice'||k==='screen')filled=!!(s&&(s.voice||s.screen));
  let need=req.includes(k);if(k==='brollStatus')need=!!(s&&s.broll);if(k==='file'&&s&&isGap(s))need=false;
  if(n===5&&k==='editInstr')need=true;
  el.classList.toggle('good',!!filled);el.classList.toggle('bad',need&&!filled)});
 const cr=d.querySelector('.crow');if(cr&&!cr.querySelector('[disabled]')){cr.classList.toggle('good',!!j.outFmt);cr.classList.toggle('bad',n===5&&!j.outFmt)}
 d.querySelectorAll('[data-qc]').forEach(c=>{if(c.disabled)return;const l=c.closest('label');l.classList.toggle('good',c.checked);l.classList.toggle('bad',n===6&&!c.checked)})}

   j.review=r;upd({review:r});resetAppr(j,n);const rows=d.querySelectorAll('[data-rvrow]');rows.forEach(rw=>{const cur=r[rw.dataset.rvrow]||{};rw.className='rvrow '+(cur.st||'');rw.querySelectorAll('[data-rv]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.rv.split('|')[1]===cur.st));const ni=rw.querySelector('.rvnote');ni.hidden=!(cur.st&&cur.st!=='ok')});
   const c=rvStats(j),st=$('#rvstat');if(st)st.textContent=`Верно ${c.ok} · Пропущено ${c.miss} · Лишнее ${c.extra} · Не проверено ${c.none}`;ready(j,n);return}
  const b=e.target.closest('[data-addtake],[data-rmtake],[data-upl],[data-edone]');if(!b)return;const sc=[...j.scenes];
  if(b.dataset.edone!=null){const i=+b.dataset.edone,on=!sc[i].edited;sc[i]={...sc[i],edited:on,editedAt:on?Date.now():null};return upd({scenes:sc})}
  if(b.dataset.addtake!=null){const i=+b.dataset.addtake;sc[i]={...sc[i],takes:[...(sc[i].takes||[]),{file:'',inout:'',note:''}]};return upd({scenes:sc})}

  if(b.dataset.upl&&AS){const[i,ti]=b.dataset.upl.split(':').map(Number);const inp=document.createElement('input');inp.type='file';inp.accept='video/*,image/*';
   inp.onchange=async()=>{const f=inp.files[0];if(!f)return;setStatus('Загружается: '+f.name+'…');try{const r=await AS.upload(f);const tk=[...sc[i].takes];tk[ti]={...tk[ti],file:r.url};sc[i]={...sc[i],takes:tk};upd({scenes:sc});setStatus('Загружено: '+f.name)}catch(err){setStatus('Не удалось загрузить (лимит 20 МБ): '+(err.message||err.code))}};inp.click()}});
 const ru=$('#rupl');if(ru)ru.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='video/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;setStatus('Загружается: '+f.name+'…');try{const r=await AS.upload(f);j.renderUrl=r.url;j.renderIsFile=true;upd({renderUrl:r.url,renderIsFile:true});setStatus('Ролик загружен');ready(j,n)}catch(err){setStatus('Не удалось загрузить (лимит 20 МБ): '+(err.message||err.code)+'. Вставьте ссылку.')}};inp.click()};
 d.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||t.type==='checkbox')return;const v=t.type==='number'?+t.value:t.value;
  if(t.dataset.i!=null){const sc=[...j.scenes];sc[+t.dataset.i]={...sc[+t.dataset.i],[k]:v};j.scenes=sc}else j[k]=v;mark(j,n)});
 d.addEventListener('change',e=>{const t=e.target;if(t.dataset.qc){j.qc={...(j.qc||{}),[t.dataset.qc]:t.checked};resetAppr(j,n);ready(j,n);return upd({qc:j.qc})}
  const k=t.dataset.k;if(!k)return;const v=t.type==='number'?+t.value:t.value;
  if(t.dataset.i!=null){const sc=[...j.scenes];const cur=sc[+t.dataset.i];sc[+t.dataset.i]={...cur,[k]:v,...(['how','who','place','editInstr','broll'].includes(k)?{src:{...(cur.src||{}),[k]:BYSTAGE[n]}}:{})};j.scenes=sc;resetAppr(j,n);ready(j,n);upd({scenes:sc})}else{j[k]=v;const o={[k]:v};if(k==='outFmt'){j.outFmtBy=BYSTAGE[n];o.outFmtBy=j.outFmtBy}if(k==='music'){j.musicBy=BYSTAGE[n];o.musicBy=j.musicBy}resetAppr(j,n);ready(j,n);upd(o);if(k==='outFmt'||k==='music')apUI(j,n)}});
 d.addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(!c||c.disabled)return;const on=c.getAttribute('aria-pressed')!=='true';c.setAttribute('aria-pressed',on);
  const v=[...d.querySelectorAll('[data-chip]')].filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.chip).join(', ');

 $('#back').onclick=()=>{openId=null;render()};
